##
# Use this tool to run "lint operations"
# on your terraform code, such as `terraform fmt` and `terraform validate`
##
name: Lint Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the project files"
        required: false
        type: string
        default: "."
      terraform-version:
        required: false
        type: string
        description: "What Terraform version to use. Takes priority over use-required-version. Defaults to the latest version"
      use-required-version:
        required: false
        type: boolean
        default: false
        description: "Set to true to use the first `required_version` found in working-directory, infrastructure, terraform/template or terraform when terraform-version is not set. Falls back to the latest version if none is found. Defaults to false"
      run-fmt:
        required: false
        type: boolean
        default: true
        description: "Set to false if you don't want to run `terraform fmt`. Defaults to true"
      run-validate:
        required: false
        type: boolean
        default: true
        description: "Set to false if you don't want to run `terraform validate`. Defaults to true"
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "The GitHub runner to run this on. Defaults to ubuntu-latest, which is the recommended choice. Larger runners are faster but cost significantly more per minute, so only use them when the workload clearly needs it."

jobs:
  fmt:
    if: ${{ inputs.run-fmt }}
    name: 'fmt (${{ inputs.working-directory }})'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v6

      - name: Find Terraform version
        id: terraform-version
        if: ${{ inputs.use-required-version && inputs.terraform-version == '' }}
        uses: nsbno/platform-actions/.github/actions/helpers/find-terraform-version@v2
        with:
          directories: |
            ${{ inputs.working-directory }}
            infrastructure
            terraform/template
            terraform

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0
        with:
          terraform_version: ${{ inputs.terraform-version || steps.terraform-version.outputs.version }}

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

  validate:
    if: ${{ inputs.run-validate }}
    name: 'Validate (${{ inputs.working-directory }})'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v6

      - name: Find Terraform version
        id: terraform-version
        if: ${{ inputs.use-required-version && inputs.terraform-version == '' }}
        uses: nsbno/platform-actions/.github/actions/helpers/find-terraform-version@v2
        with:
          directories: |
            ${{ inputs.working-directory }}
            infrastructure
            terraform/template
            terraform

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0
        with:
          terraform_version: ${{ inputs.terraform-version || steps.terraform-version.outputs.version }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate