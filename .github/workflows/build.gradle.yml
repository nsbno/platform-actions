name: Build Gradle project
on:
  workflow_call:
    secrets:
      NEXUS_USERNAME:
        required: true
        description: "Nexus login username."
      NEXUS_PASSWORD:
        required: true
        description: "Nexus login password."

    inputs:
      java-version:
        required: false
        type: string
        description: "What Java version to use."
        default: "21"
      java-distribution:
        required: false
        type: string
        default: "temurin"
        description: "What Java distribution to use. Default is temurin (By Adoptium)."
      working-directory:
        required: false
        type: string
        default: "."
      artifact-name:
        required: false
        type: string
        default: "application-build"
      artifact-path:
        required: false
        type: string
        default: "build"  # Default for Gradle.
      cache-read-only:
        required: false
        type: boolean
        default: false
        description: "Whether to only read from cache."
      gradle-operations:
        required: false
        type: string
        default: "assemble -Dorg.gradle.caching=true --no-daemon"
        description: "Gradle operations to run. Do not add the OpenAPI generation task (resolve / generateOpenApiDocs) here, use openapi-generator instead."
      openapi-generator:
        required: false
        type: string
        default: ""
        description: "Optional. Generate the OpenAPI spec as part of the build. Supported values: 'swagger' (runs the 'resolve' task, for Jersey/JAX-RS) and 'springdoc' (runs the 'generateOpenApiDocs' task, for Spring MVC; starts a Postgres container for the app). Leave empty if the spec is checked in or not used. The spec ends up in the build artifact, e.g. generated/openapi-definition.json."
      git-sha:
        required: false
        type: string
        default: ${{ github.event.pull_request.head.sha || github.sha }}
      upload-test-report:
        required: false
        type: boolean
        default: false
        description: "Upload the Gradle test report as a workflow artifact when the Gradle step fails."
      test-report-path:
        required: false
        type: string
        default: "build/reports/tests/test"
        description: "Relative path (from working-directory) to the Gradle test report directory."
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "The GitHub runner to run this on. Defaults to ubuntu-latest, which is the recommended choice. Larger runners are faster but cost significantly more per minute, so only use them when the workload clearly needs it."

    outputs:
      artifact-name:
        description: The name of the artifact generated by the build
        value: ${{ inputs.artifact-name }}
      artifact-path:
        description: Where the artifact is stored in the working directory.
        value: ${{ inputs.artifact-path }}

jobs:
  build:
    name: Gradle Build
    runs-on: ${{ inputs.runs-on }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0' # Fetch all history for all branches and tags (for branches)
          ref: ${{ inputs.git-sha }}

      - name: Validate openapi-generator
        env:
          OPENAPI_GENERATOR: ${{ inputs.openapi-generator }}
        run: |
          case "${OPENAPI_GENERATOR}" in
            ""|swagger|springdoc) ;;
            *)
              echo "::error::Unsupported openapi-generator '${OPENAPI_GENERATOR}'. Supported values: swagger, springdoc (or leave empty)."
              exit 1
              ;;
          esac

      # springdoc generates the spec by starting the application, which needs a database.
      - name: Start Postgres for springdoc
        if: inputs.openapi-generator == 'springdoc'
        run: |
          docker run -d --name openapi-postgres -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=password -e POSTGRES_DB=ci \
            postgres:16
          for i in $(seq 1 30); do
            docker exec openapi-postgres pg_isready -U ci && break
            sleep 2
          done
          docker exec openapi-postgres pg_isready -U ci
          {
            echo "SPRING_PROFILES_ACTIVE=ci"
            echo "DATASOURCE_URL=jdbc:postgresql://localhost:5432/ci"
            echo "DATASOURCE_USERNAME=ci"
            echo "DATASOURCE_PASSWORD=password"
          } >> "$GITHUB_ENV"

      - uses: nsbno/platform-actions/.github/actions/tools/gradle@v2
        name: Gradle Build
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          gradle-operations: ${{ inputs.gradle-operations }} ${{ inputs.openapi-generator == 'swagger' && 'resolve' || inputs.openapi-generator == 'springdoc' && 'generateOpenApiDocs' || '' }}
          working-directory: ${{ inputs.working-directory }}
          cache-read-only: ${{ inputs.cache-read-only }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          # if exists
          BUILD_CACHE_PASSWORD: ${{ secrets.BUILD_CACHE_PASSWORD }}
          BUILD_CACHE_USERNAME: ${{ secrets.BUILD_CACHE_USERNAME }}
          GRADLE_CACHE_ENCRYPTION_KEY: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      
      - name: Store test report as Artifact on failure
        uses: actions/upload-artifact@v6
        if: failure() && inputs.upload-test-report
        with:
          name: ${{ inputs.artifact-name }}-test-report
          path: ${{ inputs.working-directory }}/${{ inputs.test-report-path }}
          retention-days: 5
          if-no-files-found: warn

      - name: Store built JAR as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{inputs.working-directory}}/${{ inputs.artifact-path }}
          retention-days: 5
