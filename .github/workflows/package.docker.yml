on:
  workflow_call:
    inputs:
      ecr-repo-name:
        required: false
        type: string
        description: "Name of the ECR repository to publish to."
        default: ${{github.event.repository.name}}
      working-directory:
        required: false
        type: string
        default: "."
        description: "What working directory we are in"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
        description: "The dockerfile"
      artifact-name:
        type: string
        default: ""
        required: false
      artifact-path:
        type: string
        default: ""
        required: false
      lambda-compatible:
        required: false
        type: boolean
        default: false
        description: "If set, the image will be built for lambda, disabling provenance and sbom."
      platforms:
        required: false
        type: string
        default: "linux/amd64"
        description: "The platforms to build for. Valid values: linux/amd64 or linux/arm64 Defaults to linux/amd64."
      aws-role-name-to-assume:
        required: false
        type: string
        description: "The AWS role name to assume. Used for migration purposes for teams using older GHA roles."
        default: ${{ vars.AWS_DEPLOYMENT_ROLE_NAME }}
      git-sha:
        required: false
        type: string
        description: "Git SHA to checkout at, and to use as image tag. Falls back to SHA of the workflow context if not provided."
      tag-as-latest:
        required: false
        type: boolean
        default: true
        description: "When `true` the image gets the 'latest' tag. Must be false when ECR repo is immutable, or you don't want it"
      include-tag-prefix:
        required: false
        type: boolean
        default: false
        description: "When `true` the image tag becomes `<prefix>-<commit-sha>`. The prefix is the default branch name (e.g. main/master) when run on the default branch, and `snapshot` otherwise. Helps to remove old versions, while ensuring production revisions are kept"
      override-tag-prefix:
        required: false
        type: string
        default: ""
        description: "Overrides the automatic prefix. Only used when include-tag-prefix is `true`."
      tag-without-prefix:
        required: false
        type: boolean
        default: true
        description: "When `true` and include-tag-prefix is enabled, the image is also tagged with the plain `<commit-sha>` for compatibility."
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "The GitHub runner to run this on. Defaults to ubuntu-latest, which is the recommended choice. Larger runners are faster but cost significantly more per minute, so only use them when the workload clearly needs it."

name: Package Docker image to ECR

permissions:
  id-token: write
  contents: read

jobs:
  build-and-upload-docker-image:
    name: Upload Docker Image to ECR
    environment: 'Service'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git-sha || github.sha }}

      - name: Download Artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{inputs.working-directory}}/${{ inputs.artifact-path }}

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ inputs.aws-role-name-to-assume }}

      - name: Validate ECR Repository Exists
        shell: bash
        run: |
          aws ecr describe-repositories \
            --query 'repositories[].repositoryName' \
            --repository-names "${{inputs.ecr-repo-name }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: image-tag
        shell: bash
        env:
          PREFIX_ENABLED: ${{ inputs.include-tag-prefix }}
          PREFIX_OVERRIDE: ${{ inputs.override-tag-prefix }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ inputs.git-sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="$SHA"
          if [ "$PREFIX_ENABLED" = "true" ]; then
            if [ -n "$PREFIX_OVERRIDE" ]; then
              prefix="$PREFIX_OVERRIDE"
            elif [ "$CURRENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
              prefix="$DEFAULT_BRANCH"
            else
              # "snapshot" follows the typical naming convention of Maven libraries.
              # It can be used to distinguish between a tag created in main versus feature branch
              # Without having to match on the specific feature branches
              prefix="snapshot"
            fi
            tag="${prefix}-${SHA}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "plain-tag=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.working-directory }}
          platforms: ${{ inputs.platforms }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repo-name }}:${{ steps.image-tag.outputs.tag }}
            ${{ inputs.include-tag-prefix && inputs.tag-without-prefix && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, inputs.ecr-repo-name, steps.image-tag.outputs.plain-tag) || '' }}
            ${{ inputs.tag-as-latest && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, inputs.ecr-repo-name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image-tag.outputs.plain-tag }}
            org.opencontainers.image.version=${{ steps.image-tag.outputs.tag }}
            org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance and sbom are not supported for lambda images
          provenance: ${{ inputs.lambda-compatible == 'false' }}
          sbom: ${{ inputs.lambda-compatible == 'false' }}
